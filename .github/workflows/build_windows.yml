name: Gerar KRONOS PRO para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descarregar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Construir executavel unico Windows
        run: |
          pyinstaller --noconfirm --windowed --onefile --icon="kronos_icon.ico" --name "KRONOS PRO" sportscode_mvp.py

      - name: Guardar ficheiro KRONOS PRO Windows
        uses: actions/upload-artifact@v4
        with:
          name: KRONOS_PRO_Windows
          path: dist/KRONOS PRO.exe
