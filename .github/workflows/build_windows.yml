name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install PyQt6 opencv-python numpy pyinstaller

      - name: Build single-file EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon="kronos_icon.ico" --name "KRONOS PRO" sportscode_mvp.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRONOS-PRO-Windows
          path: dist/KRONOS PRO.exe
